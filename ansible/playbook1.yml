- hosts: nodes
  become: true
  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: latest
        update_cache: yes

    - name: Install Docker Compose
      apt:
        name: docker-compose
        state: latest
        update_cache: yes

    - name: Add user to docker group
      user:
        name: vagrant
        groups: docker